<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="t d"><title id="t">How Rarefaction works</title><desc id="d">A coding agent calls orient over MCP; Rarefaction routes the request to a language profile, resolves the symbol, walks the call graph through the language server over LSP and returns one bounded answer.</desc><defs><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea9d34"/></marker><marker id="a-pine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#286983"/></marker><marker id="a-foam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56949f"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9893a5"/></marker><marker id="a-subtle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#797593"/></marker></defs><rect x="0.5" y="0.5" width="959" height="451" rx="18" fill="#faf4ed" stroke="#f2e9e1" stroke-width="1"/><text x="32" y="42" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">How Rarefaction works</text><text x="32" y="64" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">One MCP call in, a bounded answer out — composed from the language server's own index.</text><rect x="32" y="150" width="180" height="150" rx="14" fill="#fffaf3" stroke="#9893a5" stroke-width="1.5"/><text x="122" y="182" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Coding agent</text><text x="122" y="214" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Claude Code</text><text x="122" y="238" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Codex</text><text x="122" y="262" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">any MCP client</text><path d="M216,196 L296,196" stroke="#ea9d34" stroke-width="2" fill="none" marker-end="url(#a-gold)"/><text x="256" y="186" fill="#ea9d34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">orient(…)</text><path d="M296,262 L216,262" stroke="#286983" stroke-width="2" fill="none" marker-end="url(#a-pine)"/><text x="256" y="284" fill="#286983" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">one answer</text><text x="256" y="230" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MCP · stdio</text><rect x="300" y="84" width="340" height="334" rx="16" fill="#fffaf3" stroke="#d7827e" stroke-width="2"/><text x="320" y="114" fill="#b4637a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Rarefaction</text><text x="620" y="114" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end">MCP server</text><rect x="320" y="128" width="300" height="50" rx="10" fill="#f2e9e1"/><circle cx="343" cy="153" r="11" fill="#286983"/><text x="343" y="157.5" fill="#faf4ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="364" y="149" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Workspace router</text><text x="364" y="167" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">picks the profile and project</text><path d="M470,179 L470,189" stroke="#9893a5" stroke-width="1.5"/><rect x="320" y="190" width="300" height="50" rx="10" fill="#f2e9e1"/><circle cx="343" cy="215" r="11" fill="#56949f"/><text x="343" y="219.5" fill="#faf4ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="364" y="211" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Symbol resolver</text><text x="364" y="229" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">name or path:line:col → exact position</text><path d="M470,241 L470,251" stroke="#9893a5" stroke-width="1.5"/><rect x="320" y="252" width="300" height="50" rx="10" fill="#f2e9e1"/><circle cx="343" cy="277" r="11" fill="#907aa9"/><text x="343" y="281.5" fill="#faf4ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="364" y="273" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Graph walk</text><text x="364" y="291" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">callers ↑2, callees ↓1, deduped, capped</text><path d="M470,303 L470,313" stroke="#9893a5" stroke-width="1.5"/><rect x="320" y="314" width="300" height="50" rx="10" fill="#f2e9e1"/><circle cx="343" cy="339" r="11" fill="#ea9d34"/><text x="343" y="343.5" fill="#faf4ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="364" y="335" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Renderer</text><text x="364" y="353" fill="#797593" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">bounded Markdown + structured JSON</text><rect x="320" y="378" width="300" height="26" rx="13" fill="#faf4ed" stroke="#907aa9" stroke-width="1" stroke-dasharray="4 3"/><text x="470" y="395" fill="#907aa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">profiles: launch · prerequisites · tests · freshness</text><path d="M644,251 L704,251" stroke="#56949f" stroke-width="2" fill="none" marker-end="url(#a-foam)" marker-start="url(#a-foam)"/><text x="674" y="241" fill="#56949f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LSP</text><text x="674" y="271" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">stdio</text><rect x="708" y="84" width="220" height="334" rx="16" fill="#fffaf3" stroke="#9893a5" stroke-width="1.5"/><text x="728" y="114" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Language servers</text><rect x="724" y="128" width="188" height="38" rx="9" fill="#f2e9e1"/><rect x="724" y="128" width="5" height="38" rx="2.5" fill="#b4637a"/><text x="738" y="144" fill="#b4637a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">Swift</text><text x="738" y="159" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">sourcekit-lsp</text><rect x="724" y="174" width="188" height="38" rx="9" fill="#f2e9e1"/><rect x="724" y="174" width="5" height="38" rx="2.5" fill="#ea9d34"/><text x="738" y="190" fill="#ea9d34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">Rust</text><text x="738" y="205" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">rust-analyzer</text><rect x="724" y="220" width="188" height="38" rx="9" fill="#f2e9e1"/><rect x="724" y="220" width="5" height="38" rx="2.5" fill="#d7827e"/><text x="738" y="236" fill="#d7827e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">C / C++</text><text x="738" y="251" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">clangd</text><rect x="724" y="266" width="188" height="38" rx="9" fill="#f2e9e1"/><rect x="724" y="266" width="5" height="38" rx="2.5" fill="#286983"
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">What one orient call returns</title><desc id="d">orient on Engine.updateLocation in the Swift fixture returns its callers at depth 1 (Recorder.record, replay, the makeEngine test helper) and depth 2 (two tests), no project callees, the two tests that reach it with a command to run only them, and the four live files out of six.</desc><defs><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea9d34"/></marker><marker id="a-pine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#286983"/></marker><marker id="a-foam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56949f"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9893a5"/></marker><marker id="a-subtle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#797593"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="18" fill="#faf4ed" stroke="#f2e9e1" stroke-width="1"/><text x="32" y="42" fill="#464261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">What one orient call returns</text><text x="32" y="64" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start">orient { symbol: "Engine.updateLocation" } on fixtures/SamplePackage (Swift)</text><text x="32" y="112" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">callers · depth 2</text><text x="32" y="212" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">callers · depth 1</text><text x="32" y="312" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">the symbol</text><rect x="32" y="120" width="292" height="50" rx="10" fill="#fffaf3" stroke="#286983" stroke-width="1.5"/><text x="44" y="141" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start">testReplayScoresEveryValue()</text><text x="44" y="159" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">EngineTests.swift</text><rect x="280" y="128" width="36" height="18" rx="9" fill="#286983"/><text x="298.0" y="141" fill="#faf4ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">test</text><rect x="340" y="120" width="286" height="50" rx="10" fill="#fffaf3" stroke="#286983" stroke-width="1.5"/><text x="352" y="141" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start">testScoreDoublesLocation()</text><text x="352" y="159" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">EngineTests.swift</text><rect x="582" y="128" width="36" height="18" rx="9" fill="#286983"/><text x="600.0" y="141" fill="#faf4ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">test</text><rect x="32" y="220" width="176" height="50" rx="10" fill="#fffaf3" stroke="#9893a5" stroke-width="1.5"/><text x="44" y="241" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start">Recorder.record(_:)</text><text x="44" y="259" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">Recorder.swift:6</text><rect x="226" y="220" width="176" height="50" rx="10" fill="#fffaf3" stroke="#9893a5" stroke-width="1.5"/><text x="238" y="241" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start">replay(_:)</text><text x="238" y="259" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">Replay.swift:4</text><rect x="420" y="220" width="206" height="50" rx="10" fill="#fffaf3" stroke="#907aa9" stroke-width="1.5"/><text x="432" y="241" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start">makeEngine(_:)</text><text x="432" y="259" fill="#797593" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">EngineTests.swift:8</text><rect x="568" y="228" width="50" height="18" rx="9" fill="#907aa9"/><text x="593.0" y="241" fill="#faf4ed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">helper</text><rect x="190" y="320" width="300" height="50" rx="10" fill="#fffaf3" stroke="#ea9d34" stroke-width="2.5"/><text x="202" y="341" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start">Engine.updateLocation(_:)</text><text x="202" y="
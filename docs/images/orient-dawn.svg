e, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">swift test --filter EngineTests</text><rect x="652" y="256" width="276" height="168" rx="14" fill="#fffaf3" stroke="#907aa9" stroke-width="1.5"/><text x="668" y="282" fill="#907aa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Live files (4 of 6)</text><circle cx="674" cy="301" r="3.5" fill="#907aa9"/><text x="686" y="305" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">Engine.swift</text><circle cx="674" cy="323" r="3.5" fill="#907aa9"/><text x="686" y="327" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">Recorder.swift</text><circle cx="674" cy="345" r="3.5" fill="#907aa9"/><text x="686" y="349" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">Replay.swift</text><circle cx="674" cy="367" r="3.5" fill="#907aa9"/><text x="686" y="371" fill="#464261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">EngineTests.swift</text><text x="668" y="408" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">not reached: Shape.swift, Package.swift</text><text x="480" y="452" fill="#9893a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Tests are told apart from test helpers; a test reached through a helper still counts. Every list is bounded, and truncation is marked.</text></svg>

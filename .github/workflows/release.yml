# Publishes to npm, then the MCP Registry, then creates the GitHub release.
# Start it by pushing a tag matching package.json's version (v0.2.0), by
# publishing a GitHub release with that tag, or with "Run workflow" on main
# (the tag comes from package.json). Needs an NPM_TOKEN repository secret; the
# registry login uses this workflow's GitHub OIDC token for io.github.ip2k.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches every version field
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(jq -r .version package.json)"; fi
          version="${tag#v}"
          for file in package.json server.json plugins/rarefaction/.claude-plugin/plugin.json plugins/rarefaction/.codex-plugin/plugin.json; do
            test "$(jq -r .version "$file")" = "$version" || { echo "$file version does not match $tag"; exit 1; }
          done
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Rarefaction ${TAG#v}" --generate-notes

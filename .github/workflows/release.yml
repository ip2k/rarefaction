# Publishes to npm, then the MCP Registry, then creates the GitHub release.
# Start it by pushing a tag matching package.json's version (vX.Y.Z), by
# publishing a GitHub release with that tag, or with "Run workflow" on main
# (the tag comes from package.json). npm and the MCP Registry both log in with
# this workflow's GitHub OIDC token: npm through Trusted Publishing (npm 11.5.1+,
# hence Node 24), the registry for the io.github.ip2k namespace. No secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag matches every version field
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(jq -r .version package.json)"; fi
          version="${tag#v}"
          for file in package.json server.json plugins/rarefaction/.claude-plugin/plugin.json plugins/rarefaction/.codex-plugin/plugin.json; do
            test "$(jq -r .version "$file")" = "$version" || { echo "$file version does not match $tag"; exit 1; }
          done
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - name: Publish to npm
        run: |
          if [ "$(npm view "rarefaction-lsp-mcp@${TAG#v}" version 2>/dev/null)" = "${TAG#v}" ]; then
            echo "rarefaction-lsp-mcp@${TAG#v} is already on npm; skipping"
          else
            npm publish --access public
          fi
      - name: Wait for npm to serve the version
        run: |
          # npm processes a new version for a few minutes before serving it,
          # and the MCP Registry validates against what npm serves.
          for i in $(seq 1 40); do
            [ "$(npm view "rarefaction-lsp-mcp@${TAG#v}" version 2>/dev/null)" = "${TAG#v}" ] && exit 0
            sleep 15
          done
          echo "rarefaction-lsp-mcp@${TAG#v} not visible on npm after 10 minutes"; exit 1
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Rarefaction ${TAG#v}" --generate-notes
